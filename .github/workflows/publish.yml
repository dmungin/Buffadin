# Packages and publishes a release to CurseForge and GitHub Releases whenever
# a tag is pushed. Tags are normally created by tag.yml when a version bump
# merges to main; make sure any tag pushed by hand is annotated.
#
# It can also be run manually on an existing tag to republish it. Runs on a
# branch are skipped, since the packager would upload an alpha build.
name: Package and release
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{project-version}"
